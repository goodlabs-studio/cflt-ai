name: Wiki Lint

# main is pushed to directly on this repo, so a pull_request-only trigger would
# never fire. Mirror the same path filter on push.
on:
  pull_request:
    paths:
      - 'wiki/**'
      - 'tools/wiki-lint.py'
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - 'tools/wiki-lint.py'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run wiki-lint
        run: python tools/wiki-lint.py --full
