# =============================================================================
# inventory.example.ini
# =============================================================================
# One OCP worker node per Telum chip. 32 IFLs / 4 chips = 8 IFLs (16 lCPU) each.
# The trailing ordinal in the hostname is parsed into goodlabs.io/telum-chip by
# 01-node-baseline.yml — keep the naming contiguous from 0.
#
#   cp inventory.example.ini inventory.ini && edit
#   ansible-playbook -i inventory.ini 00-platform-validate.yml
#
# Dev override (shared IFLs / non-blocking FIPS+IPv6 checks):
#   -e allow_shared_ifls=true -e acknowledge_no_fips=true
# Never use those flags on a run whose numbers you intend to publish.
# =============================================================================

[linuxone_workers]
ocp-worker-s390x-0 ansible_host=10.0.0.10
ocp-worker-s390x-1 ansible_host=10.0.0.11
ocp-worker-s390x-2 ansible_host=10.0.0.12
ocp-worker-s390x-3 ansible_host=10.0.0.13

[linuxone_workers:vars]
ansible_user=core
ansible_python_interpreter=/usr/bin/python3

# Asserted by 00-platform-validate.yml. Change only if the LPAR really differs.
expected_ifls=32
expected_chips=4
